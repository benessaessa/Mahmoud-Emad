<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول المنظومة الأمنية للأموال العامة - GDOPFM</title>
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            text-align: center;
            color: white;
        }

        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .logo-text {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
        }

        .logo-icon {
            font-size: 3rem;
            animation: pulse 2s infinite;
        }

        .system-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
        }

        .login-body {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1.05rem;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .login-footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #e0e0e0;
        }

        .login-footer p {
            margin: 0;
            font-size: 0.85rem;
            color: #666;
        }

        .footer-credentials {
            background: #e7f3ff;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .footer-credentials strong {
            color: #667eea;
        }

        @keyframes slideIn {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .alert {
            border-radius: 12px;
            border: none;
            animation: slideIn 0.3s ease-out;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 576px) {
            .login-body {
                padding: 25px;
            }

            .login-header {
                padding: 25px 15px;
            }

            .logo-text {
                font-size: 2rem;
            }

            .logo-icon {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Login Header -->
            <div class="login-header">
                <div class="logo-section">
                    <span class="logo-text">GDOPFM</span>
                    <i class="fas fa-eagle logo-icon"></i>
                </div>
                <h2 class="system-title">المنظومة الأمنية للأموال العامة</h2>
            </div>

            <!-- Login Body -->
            <div class="login-body">
                <form onclick="handleLoginFromLoginPage(event)" id="loginForm">
                    <div class="form-group">
                        <label for="login_user" class="form-label"><i class="fas fa-user"></i> اسم المستخدم</label>
                        <input type="text" class="form-control" id="login_user" placeholder="أدخل اسم المستخدم" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="login_pass" class="form-label"><i class="fas fa-lock"></i> كلمة المرور</label>
                        <input type="password" class="form-control" id="login_pass" placeholder="أدخل كلمة المرور" autocomplete="off">
                    </div>

                    <button type="submit" class="btn btn-login">
                        <i class="fas fa-sign-in-alt"></i> دخول النظام
                    </button>
                </form>
            </div>

            <!-- Login Footer -->
            <div class="login-footer">
                <p>بيانات تجريبية للدخول:</p>
                <div class="footer-credentials">
                    اسم المستخدم: <strong>Mahmoud</strong> | كلمة المرور: <strong>191997</strong>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/file.js"></script>
    <script>
        // Login from login page - redirect to dashboard
        function handleLoginFromLoginPage(event) {
            event.preventDefault();
            
            const u = document.getElementById('login_user').value.trim();
            const p = document.getElementById('login_pass').value.trim();

            if (!u || !p) {
                showAlert("يرجى إدخال اسم المستخدم وكلمة المرور", "error");
                return;
            }

            const users = JSON.parse(localStorage.getItem('sys_users')) || [{name: "Mahmoud", pass: "191997", role: "admin", createdAt: new Date().toLocaleDateString('ar-EG')}];
            const user = users.find(x => x.name === u && x.pass === p);

            if (user) {
                // Store current user in session
                sessionStorage.setItem('currentUser', JSON.stringify(user));
                
                // Log activity
                let activityLog = JSON.parse(localStorage.getItem('sys_logs')) || [];
                activityLog.unshift({
                    msg: `سجل المستخدم ${user.name} الدخول للمنظومة`,
                    user: user.name,
                    time: new Date().toLocaleTimeString('ar-EG'),
                    date: new Date().toLocaleDateString('ar-EG')
                });
                localStorage.setItem('sys_logs', JSON.stringify(activityLog));

                showAlert("تم تسجيل الدخول بنجاح ✓", "success");
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                showAlert("خطأ! بيانات الدخول غير صحيحة", "error");
                document.getElementById('login_pass').value = '';
            }
        }

        // Allow Enter key to submit login
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('login_pass').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>
</body>
</html>
